<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0e2438"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 H0 V30" fill="none" stroke="#22d3ee" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="900" height="230" rx="14" fill="url(#bg)"/>
  <rect width="900" height="230" rx="14" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="898.5" height="228.5" rx="13" fill="none" stroke="#1f3b57" stroke-width="1.5"/>

  <!-- moving scanline -->
  <rect x="0" y="-2" width="900" height="2" fill="#22d3ee" opacity="0.12">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 234" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- left text block -->
  <text x="48" y="80" font-family="'Courier New', monospace" font-size="15" letter-spacing="4" fill="#22d3ee">// SECURITY OPERATIONS CENTER</text>
  <text x="46" y="130" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="#f1f5f9">Ahmed Reda Ali Azez</text>
  <rect x="48" y="144" width="330" height="3" rx="1.5" fill="#22d3ee" opacity="0.85"/>
  <text x="48" y="176" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#94a3b8">SOC Analyst (Entry Level)  |  Blue Team  -  Menoufia, Egypt</text>

  <circle cx="54" cy="205" r="5" fill="#34d399">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="68" y="210" font-family="'Courier New', monospace" font-size="13" fill="#34d399">open to SOC / Blue Team opportunities</text>

  <!-- drifting particles -->
  <circle cx="430" cy="60" r="2.5" fill="#22d3ee" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0 0; 12 -18; 0 0" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="180" r="2" fill="#5eead4" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0 0; -14 -12; 0 0" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="200" r="2" fill="#22d3ee" opacity="0.4">
    <animateTransform attributeName="transform" type="translate" values="0 0; 10 -16; 0 0" dur="13s" repeatCount="indefinite"/>
  </circle>

  <!-- radar -->
  <g>
    <circle cx="770" cy="110" r="88" fill="none" stroke="#155e75" stroke-width="1.5"/>
    <circle cx="770" cy="110" r="62" fill="none" stroke="#155e75" stroke-width="1" opacity="0.8"/>
    <circle cx="770" cy="110" r="36" fill="none" stroke="#155e75" stroke-width="1" opacity="0.6"/>
    <line x1="770" y1="22" x2="770" y2="198" stroke="#155e75" stroke-width="1" opacity="0.5"/>
    <line x1="682" y1="110" x2="858" y2="110" stroke="#155e75" stroke-width="1" opacity="0.5"/>
    <g>
      <path d="M770 110 L770 22 A88 88 0 0 1 801 28 Z" fill="url(#sweep)"/>
      <line x1="770" y1="110" x2="770" y2="22" stroke="#22d3ee" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" from="0 770 110" to="360 770 110" dur="5s" repeatCount="indefinite"/>
    </g>
    <circle cx="770" cy="110" r="3.5" fill="#22d3ee"/>
    <circle cx="740" cy="68" r="4" fill="#5eead4">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="808" cy="142" r="4" fill="#5eead4">
      <animate attributeName="opacity" values="1;0.15;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="748" cy="160" r="4" fill="#5eead4">
      <animate attributeName="opacity" values="1;0.15;1" dur="3.1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
